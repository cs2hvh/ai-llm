[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myllm"
version = "0.0.1"
description = "Sovereign 1B decoder-only LLM build pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "harshit.hv", email = "harshit.hv@samatva.com" }]
dependencies = [
    "keras>=3.7,<4.0",
    # 2026-05-16: pin JAX exactly. Restore-path semantics drifted across
    # Orbax 0.6 -> 0.7 (shape= kwarg removed, scalar leaves now need
    # ArrayRestoreArgs(sharding=...) not bare RestoreArgs()). Three G6
    # regressions in one day from a JAX minor bump. The next bump must
    # be deliberate (update tests/test_orbax_api_compat.py first).
    "jax==0.4.38",
    "jaxlib==0.4.38",
    "numpy>=2.0,<3.0",
    "tokenizers>=0.20,<0.22",
    "sentencepiece>=0.2,<0.3",
    "datasets>=3.0,<4.0",
    "transformers>=4.46,<5.0",
    "optax>=0.2.5,<0.3",   # 0.2.5 first shipped optax.contrib.muon (D10)
    "orbax-checkpoint==0.7.0",
    "tensorstore==0.1.83",  # transitive of orbax; pin explicitly so a future orbax minor doesn't drift it
    "wandb>=0.18,<0.20",
    "runpod>=1.7,<2.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.8,<3.0",
    "tqdm>=4.66,<5.0",
    "rich>=13.7,<14.0",
    "boto3>=1.35,<2.0",
    "structlog>=24.4,<26.0",
    "tenacity>=9.0,<10.0",
    "xxhash>=3.5,<4.0",
    "pyarrow>=17.0,<19.0",
    "zstandard>=0.22,<1.0",   # HF loader scripts (e.g. EleutherAI/proof-pile-2) import this directly
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-xdist>=3.6,<4.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.11,<2.0",
    "ipython>=8.27,<9.0",
]
tf = [
    "tensorflow>=2.18,<3.0",
]
# CUDA-enabled JAX for GPU pods. Pull the NVIDIA CUDA prebuilt wheels via
# the jax[cuda12] extra so we don't have to depend on the pod image's
# system CUDA. Install with `pip install -e ".[cuda]"` on a GPU pod.
# 2026-05-12: added after 5xH200 SXM pod's default install pulled the
# CPU-only jaxlib and JAX fell back to TFRT_CPU_0.
cuda = [
    "jax[cuda12]==0.4.38",
]

[tool.hatch.build.targets.wheel]
packages = ["src/myllm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
