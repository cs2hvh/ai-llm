# Decay-phase distillation recipe — R0 from 2026-05-11 dossier, revised
# 2026-05-12 after external technical reviews + factual verification.
#
# This config defines HOW the train_step.py distillation path is activated
# during the last 15% of pretraining (the WSD decay phase). The teacher
# strategy (which teachers, why) is locked in docs/teacher_distillation_strategy.md.
#
# Activation: the training loop reads this YAML and switches the
# distill_alpha + teacher_weights of make_train_step() when it crosses the
# decay-phase boundary. During the stable phase (first 85% of training)
# alpha stays at 1.0, teacher data is not streamed, train_step takes the
# CE-only path.
#
# ─── 2026-05-12 audit changes ────────────────────────────────────────────
# 1. DROPPED Mistral-Medium-3.5-128B: HF model card license is "Modified
#    MIT" with explicit $20M global consolidated monthly revenue cap that
#    applies to derivatives AND combined works. Distilling its logits
#    into our weights would arguably produce a derivative — retroactive
#    legal risk as soon as our revenue crosses the cap. Replace with an
#    Apache-2.0 / MIT-clean teacher.
# 2. DROPPED Qwen3.6-27B as "base teacher": the public Qwen3.6-27B is a
#    multimodal causal LM with vision encoder + thinking-mode-default
#    (<think>...</think> traces). NOT a base text-only model. Distilling
#    would bake in vision coupling + instruct-style traces, violating
#    "invisible distillation from base teachers".
# 3. CONFIRMED DeepSeek-V4-Pro-Base: 1.6T total params, 49B activated
#    (MoE), 1M context, 32T+ pretrain tokens, MIT license, uses Muon
#    optimizer. Strongest signal teacher, locked as primary.
# 4. SECOND TEACHER TBD: dossier verifying candidates (OLMo-2-32B-Base,
#    Mixtral 8x22B, Qwen3-*-Base SKUs, DeepSeek-V3-Base as fallback).
#    For Phase 3 canary: ONE teacher (DeepSeek-V4-Pro-Base) only.
# 5. ALPHA ANNEALING: was constant 0.3. External review recommends CE-heavy
#    at activation, teacher-heavy late. New schedule: 0.7 → 0.5 → 0.3
#    across the decay window (handled in train_step / loop; see notes).
# ─────────────────────────────────────────────────────────────────────────

name: myllm-distill-decay-v2
phase: decay        # this config only applies during the decay phase

# When in training to activate distillation. Expressed as the fraction of
# total_steps at which distillation kicks in. 0.85 matches our WSD decay
# boundary (decay_fraction: 0.15 in pilot/base configs).
activation_fraction: 0.85

# Loss-mixing coefficient. 2026-05-12 review: do NOT keep constant 0.3.
# Anneal CE-heavy → teacher-heavy across the decay window:
#   - At decay-phase start (step 0.85 × total):  alpha = 0.7
#   - Mid decay (step 0.925 × total):            alpha = 0.5
#   - End of training (step 1.00 × total):       alpha = 0.3
# Implementation: the loop or train_step computes alpha(step) linearly
# between (alpha_start, alpha_end) over the decay window; this YAML
# exposes the endpoints. (Phase B work: wire alpha_schedule through.)
alpha: 0.3                # legacy field; back-compat for train_step
alpha_schedule:
  type: linear
  start: 0.7              # at activation_fraction × total_steps
  end: 0.3                # at total_steps

# Teacher softmax temperature. 1.0 = use teacher's natural distribution.
# 2026-05-12 review: if T > 1, bump top_k to 16 because softened mass
# spills outside the cached top-K. Keeping T=1.0 keeps K=8 valid.
temperature: 1.0

# Top-K cached per token per teacher. K=8 captures >99% of teacher's
# probability mass at T=1.0. Storage math (corrected by 2026-05-12 audit):
#   K=8:  8 × (2B logit + 4B index) = 48 bytes/token/teacher
#   150B tokens × 48 B × 1 teacher  = ~7.2 TB  ← canary plan (1 teacher)
#   150B tokens × 48 B × 2 teachers = ~14.4 TB
#   200B tokens × 48 B × 2 teachers = ~19.2 TB ← if 2-teacher path proven
#
# If T is raised to 2.0+ in a later experiment, bump K to 16.
top_k: 8

# Locked teacher plan (post-2026-05-12 audit):
# - PRIMARY: DeepSeek-V4-Pro-Base (MIT, confirmed) — sole teacher for Phase 3
#   canary (5-20B tokens). Only add a second teacher after the single-teacher
#   pipeline is end-to-end proven on real data.
# - SECONDARY: TBD pending dossier verification of OLMo-2-32B-Base / Mixtral
#   8x22B / Qwen3-Base SKU. Will be added here once a candidate clears legal
#   + technical (base-only, text-only) review.
teachers:
  - id: deepseek-v4-pro-base
    hf_model: deepseek-ai/DeepSeek-V4-Pro-Base
    license: MIT
    # Verified 2026-05-12 via HF model card.
    params_total: 1_600_000_000_000      # 1.6T
    params_activated: 49_000_000_000     # 49B MoE active
    context_length: 1_000_000            # 1M
    pretrain_tokens: 32_000_000_000_000  # 32T+
    notes: "Confirmed MIT. Uses Muon optimizer. FP4/FP8 mixed precision."
    weight: 1.0
    role: primary
    r2_prefix: distillation_cache/deepseek-v4-pro-base/k8/

  # SECOND TEACHER — locked 2026-05-12 to Olmo-3-32B-Base (AllenAI).
  # COMMENTED OUT for Phase 3 canary; uncomment for 2-teacher production.
  #
  # Why Olmo-3 over alternatives (verified via dossier 2026-05-12):
  #   - Apache-2.0, true text-only base (no thinking mode, no instruct
  #     tuning, no vision encoder)
  #   - 32B dense (architectural diversification from V4-Pro's MoE)
  #   - 5.5T-token pretraining corpus, Western-skewed (counter-balances
  #     V4-Pro's Chinese-heavy corpus → less redundant teacher signal)
  #   - 64k native context (useful when we later anneal MyLLM to longer
  #     context)
  #   - Released Nov 2025 — frontier-fresh
  #
  # Alternatives considered + rejected:
  #   - Qwen3-14B-Base: Apache-2.0, 36T tokens, multilingual — but
  #     Chinese-heavy corpus duplicates V4-Pro's bias. Smaller (14B) so
  #     cheaper cache generation but less rich logits.
  #   - Mixtral-8x22B-v0.1: Apache-2.0 but 2024-vintage, architecturally
  #     redundant with V4-Pro (both MoE).
  #   - DeepSeek-V3-Base: license is "DeepSeek Model License" (custom, not
  #     OSI-approved). Plus same family as V4 = redundant.
  #   - Llama 3.3 70B: Llama Community License has a 700M-MAU clause,
  #     same class of restriction we just rejected Mistral for.
  #
  # Add only after 1-teacher canary (DeepSeek-V4-Pro-Base on 5-20B tokens)
  # has produced sane KL gradients on real data.
  #
  # - id: olmo-3-32b-base
  #   hf_model: allenai/Olmo-3-1125-32B
  #   license: Apache-2.0
  #   # Verified 2026-05-12 via HF model card.
  #   params_total: 32_000_000_000
  #   context_length: 65_536
  #   pretrain_tokens: 5_500_000_000_000
  #   notes: "AllenAI fully-open base, Western/English corpus, dense."
  #   weight: 1.0
  #   role: secondary-english-western
  #   r2_prefix: distillation_cache/olmo-3-32b-base/k8/

# Cache format — see docs/teacher_logit_cache_format.md for the binary spec.
cache_format: arrow_v1   # versioned so we can evolve without silent breakage

# Token range over which the cache must exist. If the loop tries to read
# a position outside this range, training fails fast (no silent fallback
# to CE-only without warning).
covered_token_range:
  start_step: 850000      # for a 1M-step training run (=> 1T tokens at 1M tok/step)
  end_step: 1000000

# Validation: assert these properties before declaring the cache "ready".
# 2026-05-12 audit: dtype is float32 at the READER boundary (the on-disk
# format is bf16 packed as uint16; reader converts via _bf16_bits_to_f32).
# Earlier yaml claim of "bfloat16 dtype consumer-side" was wrong — that
# was the silent-corruption bug (P0-5).
validation:
  per_teacher_logit_dtype: float32       # at reader output (post-bitcast)
  per_teacher_indices_dtype: uint32
  # Single-teacher canary expected size: 150B × 48B = ~7.2 TB.
  # 2-teacher production: ~14.4 TB.
  expected_total_size_tb_min: 6.0
  expected_total_size_tb_max: 16.0
  per_position_topk_logits_sum_p_min: 0.95   # softmax(top-8) should sum >0.95
  # If less, top-K is too small (teacher has flat tail) — bump K.
