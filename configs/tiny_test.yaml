# Tiny model config — for unit tests and CPU smoke tests only.
# DO NOT use for training.

name: myllm-tiny-test
arch: llama_decoder

layers: 4
hidden_dim: 64
ffn_dim: 128
num_heads: 4
num_kv_heads: 2
head_dim: 16
vocab_size: 1024
tie_embeddings: true

context_length: 64

position: rope
rope_base: 10000

norm: rmsnorm
norm_eps: 1.0e-5
activation: swiglu

z_loss_coef: 1.0e-4
qk_norm: false
