# Wind-tunnel Proxy B — 300M intermediate for muP transfer validation.
#
# Added 2026-05-12 per external reviewer's recommendation: validate
# that the LR/init optimum found on Proxy A (67M, width_mult=1.5)
# actually transfers as predicted before committing to the 1B base run
# (width_mult=8). Proxy B sits at width_mult=4 — the same width_mult
# as the 250M pilot, so passing here is a strong predictor that pilot
# will train cleanly.
#
# Use:
#   1. Run scripts/wind_tunnel_sweep.py on Proxy A → optimal (LR*, init*)
#   2. Run a SINGLE cell on Proxy B at (LR*, init*) for 200M-500M tokens
#   3. Verify the loss curve is smooth and end-loss is "predictable from
#      the muP transfer law" — i.e. similar to Proxy A's at the same
#      tokens-per-param density
#   4. If yes, proceed to pilot 250M with confidence
#   5. If no, investigate (likely a muP scaling bug somewhere)
#
# Architecture rules:
#   - hidden_dim = 1024 (mup.base_width = 256 → width_mult = 4)
#   - layers = 14 (Llama-3.2-1B-ish shape at smaller width)
#   - FFN ratio = 4× (same as proxy A + pilot + base)
#   - GQA 4:1 (same as base 1B — standardized per reviewer's note)
#   - head_dim = 64 (same as base)
#   - vocab_size = 131072 (full production tokenizer)
#   - context_length = 4096 (same as pilot 250M / half of base 1B's 8192;
#     Proxy A used 2048 to keep cell wall time low; Proxy B is one cell,
#     can afford 4k. The full 8k base context isn't necessary here — muP
#     transfer signal doesn't depend on training at the production seq len.)
#   - rope_base = 130000 (same as pilot)
#
# Param count: hidden=1024 × layers=14 × ~12*hidden² = ~180M body + ~134M
# embedding (131072 × 1024) = ~314M total with tied embeddings. Call it ~300M.
#
# Cost target: ONE cell, 500M tokens at ~50K tok/sec on H200 SXM
#   = 10000 sec = 2.8 hr ≈ $11. Cheap insurance vs $11-25K base run.

name: myllm-wind-tunnel-b-300m
arch: llama_decoder

# Architecture (Proxy B — intermediate transfer step)
layers: 14
hidden_dim: 1024
ffn_dim: 4096           # 4× hidden
num_heads: 16
num_kv_heads: 4         # GQA 4:1 (matches base — per reviewer's "standardize GQA")
head_dim: 64
vocab_size: 131072
tie_embeddings: true

context_length: 4096

# Position
position: rope
rope_base: 130000.0

# Norm + activation
norm: rmsnorm
norm_eps: 1.0e-5
activation: swiglu

# Init — value from Proxy A's optimal cell (substitute after sweep).
init_std: 0.02
scaled_init_for_residuals: false

# Stability
z_loss_coef: 1.0e-4
qk_norm: true           # same as Proxy A + pilot + base

# muP — base_width=256 → width_mult = 1024/256 = 4.0
mup:
  base_width: 256
  apply_attn_output_mult: true
  apply_ffn_output_mult: true
  apply_lm_head_output_mult: true

# Training — single cell at the optimal LR/init from Proxy A.
# Substitute the real peak_lr after the sweep completes (use --peak-lr-override).
optimizer:
  type: adamw
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  eps: 1.0e-8

lr_schedule:
  type: wsd
  peak_lr: 1.0e-3       # placeholder — set from Proxy A sweep winner
  end_lr_ratio: 0.1
  warmup_steps: 500
  decay_fraction: 0.15

batch:
  micro_batch_per_device: 4   # 300M model + 4k context — drop micro_batch from 8 to fit memory
  # sequence_length is derived from model.context_length at runtime (P0-3 fix)
  grad_accum_steps: 1

grad_clip_global_norm: 1.0
mixed_precision: bfloat16

# Token budget for the single transfer-validation cell.
target_tokens: 500_000_000     # 500M tokens — enough to see ~10 LR-half-lives + a clean U-curve segment

# Checkpointing — write at end so we can do a quick WSM check later.
checkpoint_every_steps: 5000
keep_last_n: 2
keep_every_n_steps: 10000

# Compute target.
# 500M tokens / (4 × 4096) = 30,500 steps on 1 GPU
# At ~30K tok/sec on H200 SXM for a 300M model: 500M / 30K = ~4.6 hr
expected_pod: 1x_H200_SXM
expected_hours: 5
expected_cost_usd: 20

# Pass criteria — what counts as "muP transfer validated":
# 1. No NaN steps
# 2. Loss curve monotonically decreases through warmup + first 50% of stable
# 3. End-loss at 500M tokens within 0.2 nats of "predicted" (use Chinchilla
#    interpolation from Proxy A's end-loss + Llama-style scaling-law fit)
# 4. nan_skipped counter < 0.5% of total steps
