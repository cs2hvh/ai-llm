# Base model config — ~1.24B params. Phase 4.
#
# v1 (2026-05-10): revised to match the Llama 3.2 1B proven recipe exactly.
# Sovereignty is about owning tokenizer + weights + data, not about a bespoke
# architecture. Use a known-good shape; iterate in v2 if pilot motivates it.
# See docs/governance/model_card_v1.md (auto-rendered from this file).
#
# v2 (2026-05-11): switched lr_schedule cosine -> WSD to match playbook U5
# (SmolLM2 / MiniCPM standard) and the pilot config. Caught by research
# dossier audit 2026-05-11 — pilot had been updated, base had drifted.
# Also added tokenizer R2 reference to match pilot.
#
# Changes from v0:
#   - layers:     24   -> 16    (Llama 3.2 1B is wider, fewer layers)
#   - ffn_dim:    5504 -> 8192  (4x ratio)
#   - num_heads:  16   -> 32    (Llama 3.2 1B)
#   - head_dim:   128  -> 64    (Llama 3.2 1B)
#   - rope_base:  10000 -> 500000 (Llama 3.2 1B)
#   - lr_schedule: cosine_with_warmup -> wsd (v2)

name: myllm-1b-v1
arch: llama_decoder

# Tokenizer — production v2 SPM-Unigram (matches pilot).
tokenizer:
  r2_key: tokenizer/myllm-spm-unigram-131k-v2.json
  vocab_size: 131072
  byte_fallback: true

# Architecture (matches Llama 3.2 1B)
layers: 16
hidden_dim: 2048
ffn_dim: 8192            # 4x hidden
num_heads: 32
num_kv_heads: 8          # GQA 4:1
head_dim: 64
vocab_size: 131072
tie_embeddings: true

context_length: 8192     # train at 8k natively (Llama 3.2 also did this)
context_extension_target: 32768  # extend later via YaRN
# NOTE 2026-05-12: prior key `context_extension_yarn_target` was a schema typo
# that ModelConfig silently dropped. Fixed to match the dataclass field.

# Position
position: rope
rope_base: 500000.0      # bumped from 10000 (Llama 3.2 1B value)

# Norm + activation
norm: rmsnorm
norm_eps: 1.0e-5
activation: swiglu

# Init
init_std: 0.02
scaled_init_for_residuals: true  # Llama-style scaled init for residual projections

# Stability
z_loss_coef: 1.0e-4
qk_norm: true   # R3 from 2026-05-11 dossier: now industry default at 1B+
                # (Gemini 2.0, DeepSeek-V3, Llama 3 70B all ship it). +0.3% FLOPs
                # for spike-robustness on long pretrain runs. See
                # src/myllm/model/layers.py post-RoPE q_norm/k_norm.

# muP HP transfer (2026-05-12 senior review pushback).
#
# This block lands HPs found at the wind_tunnel (hidden=384, base_width=256)
# zero-shot onto base (hidden=2048). Without it, the model uses standard
# parameterization and the HP sweep we ran at small scale would NOT
# transfer to base — LR, init scale, attention output scale would all need
# re-tuning at 2048. Shared base_width=256 across the
# wind_tunnel -> pilot -> base chain; width multiplier here = 2048/256 = 8.0.
mup:
  base_width: 256
  apply_attn_output_mult: true
  apply_ffn_output_mult: true
  apply_lm_head_output_mult: true

# Training
optimizer:
  type: adamw
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  eps: 1.0e-8

lr_schedule:
  type: wsd                # Warmup-Stable-Decay (matches pilot + playbook U5)
  peak_lr: 2.0e-4
  end_lr_ratio: 0.1
  warmup_steps: 2000
  decay_fraction: 0.15     # last 15% of total_steps is the decay phase

batch:
  global_tokens_start: 4194304     # ~4M
  global_tokens_final: 8388608     # ~8M, ramped
  sequence_length: 8192

grad_clip_global_norm: 1.0
mixed_precision: bfloat16

# Token budget.
# v1 (LOCKED 2026-05-11): 1T tokens for the v1 base run, with the full
# upgraded recipe (WSD + multi-teacher distillation + muP + WSM + doc-mask +
# QK-norm + Nemotron-CC web slot). Equivalent to Llama-1 7B token-count, but
# with 2024-2025 recipe quality on top. v2 ramp path is "continue training
# from v1 checkpoint to 3T or 9T" — no architecture/data changes required.
#
# Reference: Llama 3.2 1B (9T), SmolLM2 1.7B (11T), Qwen 2.5 1.5B (~18T),
# Gemma 3 1B (2T). Our 1T is below SOTA tokens-per-param but compensated by
# distillation and recipe upgrades. Plan: ship v1 at 1T, gate-test all
# capabilities, then ramp to 3T or 9T as v2 if quality demands.
target_tokens_v1:        1_000_000_000_000  # 1T — LOCKED for v1
target_tokens_v2_strong: 3_000_000_000_000  # 3T — OLMo-2-1B-class token budget (v2 option A; standard continuation per OLMo 2 / SmolLM3 / Qwen3 pattern)
target_tokens_v2_max:    9_000_000_000_000  # 9T — Llama 3.2 1B token regime, NOTE not parity (Llama 3.2 1B was pruned from 8B + distilled in-pretrain; see docs/plan_v3_after_review3.md §2.1)

# Checkpointing
checkpoint_every_steps: 500
keep_last_n: 3
keep_every_n_steps: 5000

# Compute target (planning, re-validate at booking time).
#
# 2026-05-12 update: revised after measured-throughput review.
# Prior estimate was 4× pod-of-8×H100 SXM @ 240K USD — that was an
# over-provisioned multi-pod number that didn't reflect either current
# H200/B200 availability OR realistic 1B-on-8GPU throughput.
#
# Measured baseline (MosaicML LLM Foundry MPT-1B, bf16, FSDP, seq=8192):
#   8× H100 SXM = 233K tok/s aggregate, 37.7% MFU
#   8× H200 SXM ≈ 240-280K tok/s (same compute, +15% HBM bandwidth)
#   32× H200 SXM ≈ 1.6M tok/s (near-linear scaling through 64 GPUs)
#
# Two viable SKU paths for 1T tokens:
expected_pods_multi:           4x_pod_8xH200_SXM   # 32 GPUs IB-clustered (Lambda 1-Click)
expected_hours_baseline_multi: 168                 # ~7 days
expected_cost_usd_multi:       22000               # ~32× $3.99/GPU/hr × 168h
#
expected_pods_single:           1x_pod_8xH200_SXM  # 8 GPUs, no inter-node
expected_hours_baseline_single: 1040               # ~43 days
expected_cost_usd_single:       33000              # ~8× $3.99/GPU/hr × 1040h
#
# Multi-pod is BOTH faster AND cheaper than single-pod when scaling
# efficiency holds (~95% to 32 GPUs per published 1B benchmarks).
# Single-pod is simpler operationally and avoids IB-link-flap risk.
# See docs/plan_v3_after_review3.md §2.8 for the cost-derivation chain.
