# Base model config — ~1.24B params. Phase 4.
#
# v1 (2026-05-10): revised to match the Llama 3.2 1B proven recipe exactly.
# Sovereignty is about owning tokenizer + weights + data, not about a bespoke
# architecture. Use a known-good shape; iterate in v2 if pilot motivates it.
# See docs/governance/model_card_v1.md (auto-rendered from this file).
#
# v2 (2026-05-11): switched lr_schedule cosine -> WSD to match playbook U5
# (SmolLM2 / MiniCPM standard) and the pilot config. Caught by research
# dossier audit 2026-05-11 — pilot had been updated, base had drifted.
# Also added tokenizer R2 reference to match pilot.
#
# Changes from v0:
#   - layers:     24   -> 16    (Llama 3.2 1B is wider, fewer layers)
#   - ffn_dim:    5504 -> 8192  (4x ratio)
#   - num_heads:  16   -> 32    (Llama 3.2 1B)
#   - head_dim:   128  -> 64    (Llama 3.2 1B)
#   - rope_base:  10000 -> 500000 (Llama 3.2 1B)
#   - lr_schedule: cosine_with_warmup -> wsd (v2)

name: myllm-1b-v1
arch: llama_decoder

# Tokenizer — production v2 SPM-Unigram (matches pilot).
tokenizer:
  r2_key: tokenizer/myllm-spm-unigram-131k-v2.json
  vocab_size: 131072
  byte_fallback: true

# Architecture (matches Llama 3.2 1B)
layers: 16
hidden_dim: 2048
ffn_dim: 8192            # 4x hidden
num_heads: 32
num_kv_heads: 8          # GQA 4:1
head_dim: 64
vocab_size: 131072
tie_embeddings: true

context_length: 8192     # train at 8k natively (Llama 3.2 also did this)
context_extension_target: 32768  # extend later via YaRN
# NOTE 2026-05-12: prior key `context_extension_yarn_target` was a schema typo
# that ModelConfig silently dropped. Fixed to match the dataclass field.

# Position
position: rope
rope_base: 500000.0      # bumped from 10000 (Llama 3.2 1B value)

# Norm + activation
norm: rmsnorm
norm_eps: 1.0e-5
activation: swiglu

# Init
init_std: 0.02
scaled_init_for_residuals: true  # Llama-style scaled init for residual projections

# Stability
z_loss_coef: 1.0e-4
qk_norm: true   # R3 from 2026-05-11 dossier: now industry default at 1B+
                # (Gemini 2.0, DeepSeek-V3, Llama 3 70B all ship it). +0.3% FLOPs
                # for spike-robustness on long pretrain runs. See
                # src/myllm/model/layers.py post-RoPE q_norm/k_norm.

# muP HP transfer (2026-05-12 senior review pushback).
#
# This block lands HPs found at the wind_tunnel (hidden=384, base_width=256)
# zero-shot onto base (hidden=2048). Without it, the model uses standard
# parameterization and the HP sweep we ran at small scale would NOT
# transfer to base — LR, init scale, attention output scale would all need
# re-tuning at 2048. Shared base_width=256 across the
# wind_tunnel -> pilot -> base chain; width multiplier here = 2048/256 = 8.0.
mup:
  base_width: 256
  apply_attn_output_mult: true
  apply_ffn_output_mult: true
  apply_lm_head_output_mult: true

# Training
optimizer:
  type: adamw
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  eps: 1.0e-8

lr_schedule:
  type: wsd                # Warmup-Stable-Decay (matches pilot + playbook U5)
  peak_lr: 2.0e-4
  end_lr_ratio: 0.1
  warmup_steps: 2000
  decay_fraction: 0.15     # last 15% of total_steps is the decay phase

batch:
  global_tokens_start: 4194304     # ~4M
  global_tokens_final: 8388608     # ~8M, ramped
  sequence_length: 8192

grad_clip_global_norm: 1.0
mixed_precision: bfloat16

# Token budget — REVISED 2026-05-12 after measured-throughput reality check.
#
# Original v1 plan: 1T tokens. After 5×H200 throughput bench (3-5% MFU on
# DP-replicated state) and senior reviewer's second-pass call, 1T became
# operationally impractical (~150 days / ~$65K pre-FSDP, ~50 days / ~$22K
# post-FSDP). Reviewer's recommendation: 100-300B floor; continue if
# loss/eval curves justify.
#
# Project decision (2026-05-12 evening): target 600B for v1 base, with
# adaptive continuation up to 1T if curves haven't plateaued. Rationale:
#   - 300B = Pythia-1.4B-2023-tier; visibly weak by 2026 standards
#   - 500B = solid v1 (Gemma 3 1B territory, defensible MMLU ~33-35%)
#   - 600B = comfortable v1 with headroom above the curve-elbow
#   - 1T = original plan, kept as ceiling for adaptive stopping
#
# Distillation reality: our plan applies multi-teacher KL ONLY in the
# decay phase (last 15% of training). So 600B-with-our-distillation gives
# ~700-720B effective-token equivalent (~1.15-1.20× multiplier on a
# decay-only schedule), NOT the 1.5-3× that throughout-training
# distillation gets. Adjusted token count compensates for this.
#
# Adaptive stop rule (v1):
#   - checkpoint every 25B tokens (Orbax + R2 mirror)
#   - full eval suite (MMLU, GSM8K, HumanEval, BBH, IFEval) every 50B
#   - hard ceiling at 1T
#   - early stop if eval gain < 1.5%/50B for 2 consecutive intervals
#   - continue past 600B only if last 100B's gain >= 3%
#
# Reference for the 600B level (2026-05-12 landscape):
#   Pythia 1.4B  : 300B  → MMLU ~26% (2023 reference; older data mix)
#   Gemma 3 1B   : 2T    → MMLU ~38%
#   MiniCPM 1.2B : 1.1T  → MMLU ~50%
#   SmolLM2 1.7B : 11T   → MMLU ~52%
#   Llama 3.2 1B : 9T    → MMLU ~49% (distilled from 8B/70B throughout)
#   Qwen 2.5 1.5B: 18T   → MMLU ~60%
# Our 600B + decay-distillation target: MMLU 33-36% honest range.
target_tokens_v1:        600_000_000_000   # 600B — target for v1 base
target_tokens_v1_floor:  300_000_000_000   # 300B — early-stop floor if eval flatlines
target_tokens_v1_ceiling: 1_000_000_000_000  # 1T — adaptive continuation ceiling
target_tokens_v2_strong: 3_000_000_000_000  # 3T — v2 option A (continue from v1 ckpt)
target_tokens_v2_max:    9_000_000_000_000  # 9T — v2 stretch (Llama 3.2 1B regime; was distilled throughout, not parity)

# Checkpointing
checkpoint_every_steps: 500
keep_last_n: 3
keep_every_n_steps: 5000

# Compute target (planning, re-validate at booking time).
#
# 2026-05-12 update: revised after measured-throughput review.
# Prior estimate (pre-2026-05-12) of 7 days / $22K on 32×H200 IB-clustered
# was based on extrapolation from MosaicML LLM Foundry MPT-1B (37.7% MFU
# w/ FSDP). That number was theoretical-best-case for OUR specific stack.
#
# 2026-05-12 measured baseline (5×H200 SXM, single pod, this codebase):
#   1B @ seq=8192, mb=1, grad-ckpt ON, DP-replicated state:
#     8.7K tok/sec/device, 3.3% MFU, 61 GB peak HBM (1 GPU)
#     ~140 GB peak HBM on 5 GPUs (OOMs — NCCL + XLA scratch overhead)
#   1B @ seq=4096, mb=1, no grad-ckpt:
#     15.1K tok/sec/device, 5.7% MFU, 91 GB peak HBM
#
# At measured numbers (NOT theoretical), single-pod 5×H200 hits:
#   1T tokens at seq=4096:  ~150 days  ~$65K (no FSDP needed)
#   1T tokens at seq=8192:  ~270 days  ~$117K (requires FSDP; mb=1 still)
#
# 2026-05-12 senior reviewer second-pass + project re-think:
#
# v1 target is 600B tokens (with adaptive continuation to 1T ceiling).
# Reasoning: 300B is Pythia-2023-tier; 1T is operationally too long
# at our measured throughput; 600B sits comfortably above the curve-elbow
# where most of the per-token quality is gained, with headroom for
# adaptive stopping if curves are still steep.
#
# Wall-time estimates for 600B target (5×H200 single-pod, NEEDS REMEASURE
# after FSDP lands — these are pre-FSDP projections from measured tok/sec):
#   seq=4096, no FSDP, mb=1:  600B / 75K tok/sec = ~92 days, ~$39K
#   seq=8192, no FSDP, mb=1:  600B / 43.5K       = ~160 days, ~$67K (OOMs at 5-GPU; not viable)
#   seq=4096, FSDP, mb≥4:     est ~30-45 days, ~$13-19K
#   seq=8192, FSDP, mb≥2:     est ~50-70 days, ~$21-29K
#
# Staged validation ladder before launching the 600B base:
#   Stage 0:  1-5B    1B-shape rehearsal       (validate FSDP + canaries)
#   Stage 1: 30-50B   250M pilot               (~2-3 days, ~$1K)
#   Stage 2: 10-30B   1B systems rehearsal
#   Stage 3: 600B     1B base-v0 (THIS LINE)
#   Stage 4: continue toward 1T ONLY if 600B eval gain > 3% / 100B
#
# Theoretical-best-case (kept for the v2 retrospective, post-FSDP):
expected_pods_multi:           4x_pod_8xH200_SXM   # 32 GPUs IB-clustered
expected_hours_baseline_multi: 168                 # ~7 days IF FSDP @ 38% MFU
expected_cost_usd_multi:       22000               # NOT MEASURED — superseded
#
expected_pods_single:           1x_pod_8xH200_SXM
expected_hours_baseline_single: 1040               # NOT MEASURED — superseded
expected_cost_usd_single:       33000              # NOT MEASURED — superseded
#
# Measured (DP-replicated, current code, 2026-05-12):
measured_5xh200_seq8192_tok_per_sec_device: 8674
measured_5xh200_seq8192_mfu_pct:            3.3
measured_5xh200_seq8192_peak_hbm_gb:        61   # single device
measured_5xh200_seq4096_tok_per_sec_device: 15147
measured_5xh200_seq4096_mfu_pct:            5.7
#
# Post-FSDP target (to re-measure after implementation):
target_5xh200_seq8192_tok_per_sec_device:   "TBD — re-bench after FSDP lands"
