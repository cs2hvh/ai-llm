# Mini pilot — ~100M params, designed as a fast end-to-end validation.
#
# Purpose: lets us complete a full training cycle (warmup → stable →
# decay → final checkpoint → release scorecard) in 1-3 hours on a
# single GPU pod, so we can see what the FINISHED state looks like
# before the real 250M pilot wraps up (~22 hr ETA).
#
# Created on the `dev-small` branch (2026-05-14). NOT a production
# training run — it's a lifecycle validation only. Loss numbers from
# this run are not directly comparable to the 250M pilot (different
# model size, different effective tokens-per-param ratio).
#
# Same recipe as pilot_250m.yaml except:
#   - hidden_dim 768 → 512
#   - layers 16 → 10
#   - num_heads 12 → 8 (head_dim stays at 64)
#   - num_kv_heads 4 → 2 (keeps GQA 4:1)
#   - warmup_steps 2000 → 500 (since total run is much shorter)
#
# muP transfer still works: base_width=256 stays the same. width_mult
# here = 512/256 = 2.0 (vs 3.0 in pilot_250m).

name: myllm-pilot-100m-v1
arch: llama_decoder

tokenizer:
  r2_key: tokenizer/myllm-spm-unigram-131k-v2.json
  vocab_size: 131072
  byte_fallback: true

# Architecture (downscaled from pilot_250m)
layers: 10
hidden_dim: 512
ffn_dim: 2048            # 4x hidden
num_heads: 8
num_kv_heads: 2          # GQA 4:1 (same ratio as 250m)
head_dim: 64
vocab_size: 131072
tie_embeddings: true

# Same corpus as pilot_250m
context_length: 8192
context_extension_target: 8192

# Position
position: rope
rope_base: 500000.0

# Norm + activation
norm: rmsnorm
norm_eps: 1.0e-5
activation: swiglu

# Init
init_std: 0.02
scaled_init_for_residuals: true

# Stability
z_loss_coef: 1.0e-4
qk_norm: true

# muP — same base_width as pilot_250m so HPs transfer
mup:
  base_width: 256
  apply_attn_output_mult: true
  apply_ffn_output_mult: true
  apply_lm_head_output_mult: true

# Training
optimizer:
  type: adamw
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  eps: 1.0e-8

lr_schedule:
  type: wsd
  peak_lr: 3.0e-4
  end_lr_ratio: 0.1
  warmup_steps: 500        # shorter warmup since total run is short
  decay_fraction: 0.15

batch:
  sequence_length: 8192
  global_tokens: 65536     # informational; actual mb set in data yaml or via CLI

dropout:
  attention: 0.0
  embedding: 0.0
  hidden: 0.0

# Watchdog (same as pilot_250m)
watchdog:
  loss_spike_sigma: 6.0
  loss_spike_soft_sigma: 3.0
  window: 200
  min_observations: 50
  max_recoveries: 5
  recovery_lr_multiplier: 0.5
  skip_batches_after_recovery: 16

# Where to log/store
expected_pod: any_single_gpu     # designed to run on cheapest available
expected_step_time_sec: 0.10     # rough: 1×H100 at mb=8 → ~80ms/step
