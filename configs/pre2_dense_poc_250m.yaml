# Compute-limited pre-2 POC config.
# Purpose: produce a stronger architecture/data/eval signal than the canary
# while staying much cheaper than the 400M proxy and 1.5B target.

schema_version: 0.1
status: planning
name: myllm-pre2-dense-poc-250m
stack: torchtitan

model:
  architecture: decoder_only_transformer
  parameter_target: 240_000_000
  layers: 16
  hidden_dim: 768
  ffn_dim: 3072
  activation: swiglu
  norm: rmsnorm
  norm_eps: 1.0e-5
  qk_norm: true
  attention:
    type: gqa
    num_heads: 12
    num_kv_heads: 4
    head_dim: 64
  position:
    type: rope
    rope_base: 1_000_000
  embeddings:
    tied: true
  tokenizer:
    decision: provisional_reference_vocab_for_poc
    candidates: [64_000, 96_000, 131_075]
    current_reference_vocab_size: 131_075
  context:
    foundation_length: 8192
    continuation_lengths: [16_384]

training:
  dtype: bf16
  objective:
    next_token_ce: true
    z_loss_coef: 1.0e-4
    disabled_paths:
      - heterogeneous_tokenizer_topk_logit_kd
  optimizer:
    type: adamw
    beta1: 0.9
    beta2: 0.95
    weight_decay: 0.1
    eps: 1.0e-8
    grad_clip_global_norm: 1.0
  scheduler:
    type: wsd
    peak_lr: 3.0e-4
    lr_ablations: [2.0e-4, 3.0e-4, 4.0e-4]
    warmup_steps_range: [500, 1500]
    stable_fraction: 0.90
    decay_fraction: 0.10
    end_lr_ratio: 0.0
  batch:
    global_batch_tokens: 524_288
    sequence_length: 8192
    example_4gpu:
      micro_batch_sequences_per_gpu: 1
      grad_accum_steps: 16
  token_budget:
    smoke: 500_000_000
    study_minimum: 3_000_000_000
    study_target: 10_000_000_000
    study_stretch: 20_000_000_000

parallelism:
  strategy: single_gpu_or_fsdp2
  checkpointing: pytorch_distributed_checkpointing
  purpose: compute-limited POC before 400M proxy and 1.5B mainline

study_outputs:
  - validation_loss_by_source_bucket
  - eval_scorecard_poc
  - checkpoint_resume_report
  - throughput_report
  - go_no_go_to_400m_proxy
