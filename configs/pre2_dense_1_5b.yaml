# Planning config for the pre-2 dense foundation model.
# This file is not consumed by the pre-1 JAX/Keras training entrypoints.

schema_version: 0.1
status: planning
name: myllm-pre2-dense-1.5b-base
stack: torchtitan

model:
  architecture: decoder_only_transformer
  parameter_target: 1_490_000_000
  layers: 20
  hidden_dim: 2048
  ffn_dim: 8192
  activation: swiglu
  norm: rmsnorm
  norm_eps: 1.0e-5
  qk_norm: true
  attention:
    type: gqa
    num_heads: 32
    num_kv_heads: 8
    head_dim: 64
  position:
    type: rope
    rope_base: 1_000_000
    rope_base_ablations: [500_000, 5_000_000]
  embeddings:
    tied: true
  tokenizer:
    decision: ablate_before_main_run
    candidates: [64_000, 96_000, 131_075]
    current_reference_vocab_size: 131_075
  context:
    foundation_length: 8192
    continuation_lengths: [16_384, 32_768]

training:
  dtype: bf16
  objective:
    next_token_ce: true
    z_loss_coef: 1.0e-4
    disabled_paths:
      - heterogeneous_tokenizer_topk_logit_kd
  optimizer:
    type: adamw
    beta1: 0.9
    beta2: 0.95
    weight_decay: 0.1
    eps: 1.0e-8
    grad_clip_global_norm: 1.0
  scheduler:
    type: wsd
    peak_lr: 2.0e-4
    lr_ablations: [1.5e-4, 2.0e-4, 3.0e-4]
    warmup_steps_range: [2000, 5000]
    stable_fraction: 0.90
    decay_fraction: 0.10
    end_lr_ratio: 0.0
  batch:
    global_batch_tokens: 2_097_152
    sequence_length: 8192
    example_8gpu:
      micro_batch_sequences_per_gpu: 1
      grad_accum_steps: 32
  token_budget:
    internal_minimum: 1_000_000_000_000
    release_target: 1_500_000_000_000
    stretch: 3_000_000_000_000
    research_ceiling: 5_000_000_000_000

parallelism:
  strategy: fsdp2_dtensor
  tensor_parallel: optional_after_baseline
  pipeline_parallel: off
  sequence_parallel: evaluate_if_context_extension_needs_it
  checkpointing: pytorch_distributed_checkpointing

precision_policy:
  baseline_training: bf16
  fp8_training: ablation_after_bf16_baseline
  int8_training: not_baseline
  int4_training: not_allowed
  release_exports: [bf16, fp8_or_int8_if_validated, int4_weight_only_if_validated]

gates:
  pre_run:
    - tokenizer_ablation_complete
    - data_license_register_complete
    - packed_dataloader_exact_resume
    - fsdp2_checkpoint_restore
    - real_eval_predict_path
  ten_b_tokens:
    - no_recurring_nans
    - smooth_loss
    - checkpoint_resume_exact
    - source_bucket_losses_logged
  fifty_b_tokens:
    - proxy_evals_improve
    - no_source_bucket_collapse
    - data_order_replayable
  one_t_tokens:
    - full_internal_eval
    - continue_or_stop_decision
  one_point_five_t_tokens:
    - final_scorecard
    - governance_packet
    - release_or_continue_decision
